name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      database:
        description: Database used by the tests
        type: choice
        options:
          - default
          - mysql
          - postgresql
        default: default

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The databases used by the tests are chosen, in order of priority, by:
    # - the "database" input, when the workflow is started manually;
    # - the TEST_DATABASES repository variable, a JSON list (e.g. ["mysql"]);
    # - otherwise, both MySQL and PostgreSQL.
    strategy:
      fail-fast: false
      matrix:
        db: ${{ fromJSON(
          (inputs.database == 'mysql' && '["mysql"]') ||
          (inputs.database == 'postgresql' && '["postgresql"]') ||
          vars.TEST_DATABASES ||
          '["mysql","postgresql"]') }}

    name: build-and-test (${{ matrix.db }})

    # MySQL is preinstalled on the runner, PostgreSQL runs as a service container
    # (an empty image skips the service)
    services:
      postgres:
        image: ${{ matrix.db == 'postgresql' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: iam
          POSTGRES_USER: iam
          POSTGRES_PASSWORD: pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iam -d iam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        cache: maven
        java-version: 17

    - name: License check
      run: |
        mvn -version
        mvn -B license:check

    - name: Start MySQL
      if: matrix.db == 'mysql'
      run: |
        sudo systemctl start mysql
        mysql -uroot -proot -e "CREATE USER 'iam'@'%' IDENTIFIED BY 'pwd';"
        mysql -uroot -proot -e "CREATE DATABASE iam CHARACTER SET latin1 COLLATE latin1_swedish_ci;"
        mysql -uroot -proot -e "GRANT ALL ON *.* TO 'iam'@'%';"
        mysql -uroot -proot -e "FLUSH PRIVILEGES;"

    - name: Build & ${{ matrix.db }} tests
      env:
        IAM_DB_HOST: localhost
      run: |
        mvn -Dspring.profiles.active=${{ matrix.db }}-test -q package install

  build-docker-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ success() }}

    steps:

    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        cache: maven
        java-version: 17

    - name: Build & Package
      run: |
        mvn -DskipTests package install

    - name: Copy artifacts to docker dir
      run: |
        cp iam-login-service/target/iam-login-service.war iam-login-service/docker
        cp iam-voms-aa/target/iam-voms-aa.jar iam-voms-aa/docker

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Docker login
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/develop'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Docker metainformation for iam-login-service
      id: ls-meta
      # tag v5
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      with:
        images: indigoiam/iam-login-service
        flavor: |
          latest=false
        tags: |
          type=sha
          type=ref,event=tag
          type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

    - name: Docker metainformation for iam-voms-aa
      id: va-meta
      # tag v5
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      with:
        images: indigoiam/iam-voms-aa
        flavor: |
          latest=false
        tags: |
          type=sha
          type=ref,event=tag
          type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

    - name: Build & push iam-login-service docker image
      # tag v6
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        tags: ${{ steps.ls-meta.outputs.tags }}
        labels: ${{ steps.ls-meta.outputs.labels }}
        context: iam-login-service/docker/
        file: iam-login-service/docker/Dockerfile.prod
        platforms: linux/amd64,linux/arm64
        push: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/develop' }}

    - name: Build & push iam-voms-aa docker image
      # tag v6
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        tags: ${{ steps.va-meta.outputs.tags }}
        labels: ${{ steps.va-meta.outputs.labels }}
        context: iam-voms-aa/docker/
        file: iam-voms-aa/docker/Dockerfile.prod
        platforms: linux/amd64,linux/arm64
        push: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/develop' }}
