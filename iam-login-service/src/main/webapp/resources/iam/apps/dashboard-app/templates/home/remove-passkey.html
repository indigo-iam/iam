<div class="modal-header">
  <h3 class="modal-title">Remove passkey</h3>
</div>

<div class="modal-body">
  <div class="form-group">
    Are you sure you want to remove the passkey <strong>{{passkeyCtrl.passkey.label}}</strong>?
    It will no longer be accepted as a second factor when you log in.
  </div>
  <span class="help-block" ng-show="operationResult" style="color: #a94442;">{{ operationResult.text }}</span>
</div>

<div class="modal-footer">
  <button class="btn btn-danger" type="button" name="remove" id="modal-btn-remove" ng-click="passkeyCtrl.submitRemove()" ng-disabled="passkeyCtrl.requestPending">Remove</button>
  <button class="btn btn-default" type="button" name="cancel" id="modal-btn-cancel" ng-click="passkeyCtrl.dismiss()">Cancel</button>
</div>
