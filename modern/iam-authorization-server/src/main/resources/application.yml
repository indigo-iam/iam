spring:
  application:
    name: iam-sas

  datasource:
    url: jdbc:h2:mem:iam
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/h2
      - classpath:db/migration/test
