# Runs the tests against a real PostgreSQL database, with the same schema and test data
# used by the login service tests (see VomsAcPostgresqlTests)

server:
  address: localhost
  port: 15000

spring:
  flyway:
    enabled: true
    table: schema_version
    locations:
      - classpath:db/migration/postgresql
      - classpath:db/migration/postgresql_test
  datasource:
    url: jdbc:postgresql://${IAM_DB_HOST:localhost}:${IAM_DB_PORT:5432}/${IAM_DB_NAME:iam}${IAM_DB_URL_PARAMS:}
    username: ${IAM_DB_USERNAME:iam}
    password: ${IAM_DB_PASSWORD:pwd}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-test-query: SELECT 1

voms:
  tls:
    certificate-path: src/test/resources/certs/voms_example.cert.pem
    private-key-path: src/test/resources/certs/voms_example.key.pem
    trust-anchors-dir: src/test/resources/trust-anchors
    trust-anchors-refresh-interval-secs: 0
