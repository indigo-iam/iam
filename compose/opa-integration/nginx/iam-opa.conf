server {
  listen 80;
  listen [::]:80;
  server_name _;

  location /bundles/ {
        alias /usr/share/nginx/html/bundles/;
        autoindex on;
        types {
            application/gzip gz tgz tar.gz;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
  }

  location / {
        return 301 https://$host$request_uri;
  }
  
}

server {
  listen        443 ssl;
  listen        [::]:443 ssl;
  server_name   iam.local.io;
  access_log   /var/log/nginx/iam_local_io.access.log  combined_ssl;

  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
  
  ssl_certificate      /certs/iam_local_io.cert.pem;
  ssl_certificate_key  /certs/iam_local_io.key.pem;
  ssl_client_certificate  /etc/pki/tls/certs/ca-bundle.crt;

  ssl_verify_client optional;

  location / {
    proxy_pass              http://iam-be:8080;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto https;
    proxy_set_header        Host $http_host;

    # TLS stuff

    proxy_set_header        X-SSL-Client-Cert $ssl_client_cert;
    proxy_set_header        X-SSL-Client-I-Dn $ssl_client_i_dn;
    proxy_set_header        X-SSL-Client-S-Dn $ssl_client_s_dn;
    proxy_set_header        X-SSL-Client-Serial $ssl_client_serial;
    proxy_set_header        X-SSL-Client-V-Start $ssl_client_v_start;
    proxy_set_header        X-SSL-Client-V-End   $ssl_client_v_end;
    proxy_set_header        X-SSL-Client-Verify  $ssl_client_verify;
    proxy_set_header        X-SSL-Protocol $ssl_protocol;
    proxy_set_header        X-SSL-Server-Name $ssl_server_name;
  }

  location /iam-test-client {
    proxy_pass              http://client:9090/iam-test-client;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto https;
    proxy_set_header        Host $http_host;
  }

}