volumes:
  trust:
  cabundle:
  hostcerts:
  
services:

  trust:
    build:
      context: ./../trust-anchors
    volumes:
      - trust:/trust-anchors
      - cabundle:/etc/pki
      - hostcerts:/hostcerts
    environment:
      FORCE_TRUST_ANCHORS_UPDATE: "true"

  db:
    container_name: db
    image: mysql:8.3

    volumes:
      - ./db/dump-10.sql:/docker-entrypoint-initdb.d/dump.sql
      - ./db/scripts:/tmp/scripts
    
    environment:
      MYSQL_ROOT_PASSWORD: pwd
      MYSQL_USER: iam
      MYSQL_PASSWORD: pwd
      MYSQL_DATABASE: iam

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 0s

  iam-be:
    container_name: iam-be
    image: indigoiam/iam-login-service:v1.16.0-opa1

    environment:
      IAM_JAVA_OPTS: -Dspring.profiles.active=mysql-test,wlcg-scopes
      IAM_FORWARD_HEADERS_STRATEGY: native
      IAM_BASE_URL: https://iam.local.io
      IAM_ISSUER: https://iam.local.io/
      IAM_ORGANISATION_NAME: iam-opa
      IAM_DB_HOST: db
      IAM_JWT_DEFAULT_PROFILE: wlcg
      IAM_ACCESS_TOKEN_INCLUDE_SCOPE: true
      IAM_OPA_ENABLED: true
      IAM_OPA_URL: http://opa:8181

    volumes:
      - /dev/urandom:/dev/random

    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/.well-known/openid-configuration"]

    depends_on:
      db:
        condition: service_healthy

  client:
    image: indigoiam/iam-test-client:v1.14.4

    container_name: client

    environment:
      IAM_CLIENT_FORWARD_HEADERS_STRATEGY: native
      IAM_CLIENT_TLS_USE_GRID_TRUST_ANCHORS: true
      IAM_CLIENT_ISSUER: https://iam.local.io/
      IAM_CLIENT_SCOPES: openid profile email offline_access phone storage.create:/ storage.modify:/ storage.read:/ storage.stage:/ iam:admin.read iam:admin.write
      IAM_CLIENT_HIDE_TOKENS: false

    volumes:
      - trust:/etc/grid-security/certificates

    healthcheck:
      test: ["CMD", "curl", "http://localhost:9090/iam-test-client/actuator/health"]

  nginx:
    image: nginx:stable-alpine
    container_name: nginx

    logging:
      driver: "syslog"

    volumes:
      - cabundle:/etc/pki
      - hostcerts:/certs
      - ./nginx/iam-opa.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "443:443"

    dns_search: local.io

    networks:
      default:
        aliases:
          - iam.local.io

    healthcheck:
      test: ["CMD", "curl", "http://localhost/"]
    
    depends_on:
      iam-be:
        condition: service_healthy
      client:
        condition: service_healthy
      trust:
        condition: service_completed_successfully

  opa:
    image: openpolicyagent/opa:latest-debug

    volumes:
      - ./opa/conf:/etc/opa/conf

    command: >
      run --server
      --log-format json-pretty
      -c /etc/opa/conf/opa-conf.yaml
      --addr http://0.0.0.0:8181

    networks:
      default:

    healthcheck:
      test: ["CMD", "wget", "http://localhost:8181/health", "-O", "/tmp/health"]

    depends_on:
      iam-be:
        condition: service_healthy

  opa-dev:
    image: openpolicyagent/opa:latest-debug

    volumes:
      - ./opa/conf:/etc/opa/conf
      - ./iam-policies.tar.gz:/etc/opa/policies.tar.gz

    command: >
      run --server
      --log-format json-pretty
      -c /etc/opa/conf/local-conf.yaml
      --addr http://0.0.0.0:8181

    ports:
      - "8181:8181"

