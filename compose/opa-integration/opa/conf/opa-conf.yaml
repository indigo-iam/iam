services:
  gh:
    url: https://ghcr.io
    type: oci
  iam:
    url: http://iam-be:8080/

bundles:
  scope-policy-engine:
    service: gh
    resource: ghcr.io/indigo-iam/opa-iam:latest
    persist: true
    polling:
      min_delay_seconds: 20
      max_delay_seconds: 40
  policies:
    service: iam
    resource: iam/scope_policies/opa_bundle
    persist: true
    polling:
      min_delay_seconds: 10
      max_delay_seconds: 20

persistence_directory: /tmp/opa

decision_logs:
  console: true

default_decision: rules