[ db-primary_test_example ]

default_bits           = 2048
default_keyfile        = ${ENV::CA_NAME}/certs/db-primary_test_example.key.pem
distinguished_name     = db-primary_test_example_dn
prompt                 = no
encrypt_key            = no
default_md             = sha512
days                   = 3650
x509_extensions        = db-primary_test_example_extensions

[ db-primary_test_example_dn ]

C                      = IT
O                      = IGI
CN                     = db-primary.test.example

[ db-primary_test_example_extensions ]

basicConstraints       = critical,CA:FALSE
subjectKeyIdentifier   = hash
keyUsage               = critical, digitalSignature, keyEncipherment
extendedKeyUsage       = serverAuth
authorityKeyIdentifier = keyid, issuer
subjectAltName         = DNS:db-primary.test.example
